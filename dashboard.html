<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteiro de Visitas — Cuiabá e Várzea Grande</title>
  <meta name="description" content="Painel principal do roteiro de visitas médicas em Cuiabá e Várzea Grande.">
  <meta name="theme-color" content="#17324d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roteiro Cuiabá">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">

  <style>
    /* ===================== RESET & BASE ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-header-start: #17324d;
      --color-header-end: #1f4a6e;
      --color-primary: #176b8f;
      --color-green: #1a7a45;
      --color-green-light: #e6f4ec;
      --color-orange: #d35400;
      --color-bg: #f2f5f8;
      --color-card: #ffffff;
      --color-border: #dce5ed;
      --color-text: #243447;
      --color-muted: #637381;
      --color-badge-next-bg: #16733b;
      --color-badge-warn-bg: #fff1cc;
      --color-badge-warn-text: #7a4d00;
      --color-badge-conflict-bg: #fee2e2;
      --color-badge-conflict-text: #991b1b;
      --color-badge-done-bg: #e2e8ed;
      --color-badge-done-text: #526273;
      --color-badge-absent-bg: #fff3e0;
      --color-badge-absent-text: #b05000;
      --color-nav-height: 64px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      padding-bottom: calc(var(--color-nav-height) + env(safe-area-inset-bottom));
    }

    /* ===================== HEADER ===================== */
    header {
      background: linear-gradient(150deg, var(--color-header-start) 0%, var(--color-header-end) 100%);
      color: #fff;
      padding: max(18px, env(safe-area-inset-top)) 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .header-title h1 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .header-title p {
      font-size: 0.82rem;
      color: #b8d4e8;
      margin-top: 2px;
    }

    .header-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .clock {
      font-size: 1.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .date-label {
      font-size: 0.72rem;
      color: #b8d4e8;
      text-align: right;
    }

    .network-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(255,255,255,0.12);
      color: #c8e6f5;
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.3s;
    }
    .network-pill.offline { background: rgba(154,52,18,0.8); color: #fde8e0; border-color: transparent; }
    .network-pill::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }
    .network-pill.offline::before { background: #f87171; }

    /* ===================== CTA BUTTON ===================== */
    .cta-section {
      padding: 20px 16px 0;
    }

    .cta-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: linear-gradient(135deg, #1a7a45, #22a05a);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 18px 20px;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(26,122,69,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-button:active {
      transform: scale(0.98);
      box-shadow: 0 3px 10px rgba(26,122,69,0.3);
    }

    .cta-text strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .cta-text span {
      display: block;
      font-size: 0.75rem;
      color: #a7f3c4;
      margin-top: 4px;
      line-height: 1.3;
    }

    .cta-arrow {
      font-size: 1.8rem;
      flex-shrink: 0;
      margin-left: 12px;
    }

    /* ===================== SEARCH ===================== */
    .search-section {
      padding: 16px 16px 0;
    }

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--color-muted);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--color-card);
      color: var(--color-text);
      outline: none;
      transition: border-color 0.2s;
    }

    #searchInput:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(23,107,143,0.12);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.1rem;
      color: var(--color-muted);
      cursor: pointer;
      padding: 4px;
      display: none;
    }
    .search-clear.visible { display: block; }

    /* ===================== FILTERS ===================== */
    .filters-section {
      padding: 12px 16px 0;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    .filter-chip {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1.5px solid var(--color-border);
      background: var(--color-card);
      color: var(--color-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .filter-chip:active { transform: scale(0.96); }

    .filter-chip.active {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .filter-chip.clear-chip {
      border-color: #f9a0a0;
      color: #c0392b;
    }
    .filter-chip.clear-chip:hover { background: #fef2f2; }

    .filter-selects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .filter-select-wrap {
      position: relative;
    }

    .filter-select-wrap select {
      width: 100%;
      padding: 9px 30px 9px 10px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      font-size: 0.8rem;
      font-family: inherit;
      background: var(--color-card);
      color: var(--color-text);
      appearance: none;
      cursor: pointer;
      outline: none;
      min-height: 40px;
    }
    .filter-select-wrap select:focus { border-color: var(--color-primary); }

    .filter-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--color-muted);
      font-size: 0.75rem;
    }

    /* ===================== SECTION HEADER ===================== */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 20px 16px 8px;
    }

    .section-header h2 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--color-text);
    }

    .section-count {
      font-size: 0.78rem;
      color: var(--color-muted);
      font-weight: 600;
    }

    /* ===================== VISIT CARDS ===================== */
    #visitList {
      padding: 0 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .visit-card {
      background: var(--color-card);
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
      transition: box-shadow 0.2s, transform 0.15s;
    }

    .visit-card:active { transform: scale(0.99); }

    .visit-card.is-next {
      border-color: #22a05a;
      background: #f0faf5;
      box-shadow: 0 4px 16px rgba(26,122,69,0.15);
    }

    .visit-card.is-done {
      opacity: 0.65;
      border-color: #c8d3db;
    }

    .visit-card.is-absent {
      border-color: #f6b067;
      background: #fff9f2;
    }

    .visit-card.is-not-done {
      border-color: #f9a0a0;
      background: #fff5f5;
    }

    .visit-card.is-rescheduled {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .visit-time-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding-top: 2px;
    }

    .visit-time {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--color-orange);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .visit-region-pill {
      display: inline-block;
      background: #edf3f7;
      color: #526273;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 0.65rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .visit-body {}

    .visit-clinic {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.25;
    }

    .visit-doctor {
      font-size: 0.83rem;
      color: var(--color-muted);
      margin-top: 3px;
      line-height: 1.3;
    }

    .visit-specialty {
      font-size: 0.75rem;
      color: var(--color-primary);
      font-weight: 700;
      margin-top: 4px;
    }

    .visit-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.67rem;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: 0.2px;
    }
    .badge-next    { background: var(--color-badge-next-bg); color: #fff; }
    .badge-warn    { background: var(--color-badge-warn-bg); color: var(--color-badge-warn-text); }
    .badge-conflict{ background: var(--color-badge-conflict-bg); color: var(--color-badge-conflict-text); }
    .badge-done    { background: var(--color-badge-done-bg); color: var(--color-badge-done-text); }
    .badge-absent  { background: var(--color-badge-absent-bg); color: var(--color-badge-absent-text); }
    .badge-notdone { background: #fee2e2; color: #991b1b; }
    .badge-rescheduled { background: #dbeafe; color: #1e40af; }
    .badge-pending { background: #eef3f7; color: #526273; }

    .visit-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .btn-register {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--color-border);
      background: none;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-primary);
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-register:hover { background: #edf5fa; }

    /* ===================== EMPTY STATE ===================== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--color-muted);
    }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state strong { display: block; font-size: 1rem; margin-bottom: 6px; color: var(--color-text); }
    .empty-state p { font-size: 0.85rem; line-height: 1.5; }

    /* ===================== MODAL DE REGISTRO ===================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 540px;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-handle {
      width: 40px; height: 4px;
      background: #dce5ed;
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .modal h3 {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .modal .modal-subtitle {
      font-size: 0.78rem;
      color: var(--color-muted);
      margin-bottom: 16px;
    }

    .status-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .status-btn {
      padding: 12px 10px;
      border-radius: 12px;
      border: 2px solid var(--color-border);
      background: none;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .status-btn.selected { border-color: var(--color-primary); background: #edf5fa; color: var(--color-primary); }

    .status-btn .status-icon { display: block; font-size: 1.4rem; margin-bottom: 4px; }

    #obsInput {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 70px;
      outline: none;
      margin-bottom: 14px;
    }
    #obsInput:focus { border-color: var(--color-primary); }

    .modal-footer {
      display: flex;
      gap: 8px;
    }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid var(--color-border);
      background: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-save {
      flex: 2;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--color-primary);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* ===================== NAV BAR ===================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--color-nav-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: #fff;
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -4px 18px rgba(17,24,39,0.1);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 200;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--color-muted);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }

    .nav-item .nav-icon { font-size: 1.35rem; line-height: 1; }
    .nav-item.active { color: var(--color-primary); }

    /* ===================== RESPONSIVE ===================== */
    @media (min-width: 600px) {
      header { padding: 20px max(20px, calc((100vw - 600px)/2)) 22px; }
      .cta-section,
      .search-section,
      .filters-section,
      .section-header { padding-left: max(16px, calc((100vw - 600px)/2)); padding-right: max(16px, calc((100vw - 600px)/2)); }
      #visitList { padding-left: max(16px, calc((100vw - 600px)/2)); padding-right: max(16px, calc((100vw - 600px)/2)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div class="header-title">
        <h1>Roteiro de Visitas</h1>
        <p>Cuiabá e Várzea Grande</p>
      </div>
      <div class="header-status">
        <div id="clock" class="clock">--:--</div>
        <div id="dateLabel" class="date-label">carregando...</div>
        <div id="networkPill" class="network-pill">Online</div>
      </div>
    </div>
  </header>

  <main>
    <!-- CTA BUTTON -->
    <section class="cta-section">
      <a id="ctaBtn" class="cta-button" href="agora.html">
        <div class="cta-text">
          <strong>🔍 QUEM POSSO VISITAR AGORA?</strong>
          <span>Médicos com atendimento compatível com o horário atual e próximos de você.</span>
        </div>
        <span class="cta-arrow">›</span>
      </a>
    </section>

    <!-- SEARCH -->
    <section class="search-section">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          placeholder="Médico, clínica, especialidade, região..."
          autocomplete="off"
          aria-label="Buscar médico, clínica, especialidade ou região"
        >
        <button class="search-clear" id="searchClear" aria-label="Limpar busca">✕</button>
      </div>
    </section>

    <!-- FILTERS -->
    <section class="filters-section">
      <!-- Chips de período -->
      <div class="filter-row" id="periodChips" role="group" aria-label="Filtrar por período">
        <button class="filter-chip active" data-period="all">Todos</button>
        <button class="filter-chip" data-period="manha">☀️ Manhã</button>
        <button class="filter-chip" data-period="tarde">🌤️ Tarde</button>
      </div>
      <!-- Selects de especialidade e região -->
      <div class="filter-selects">
        <div class="filter-select-wrap">
          <select id="specialtySelect" aria-label="Especialidade">
            <option value="all">Todas especialidades</option>
          </select>
        </div>
        <div class="filter-select-wrap">
          <select id="regionSelect" aria-label="Região">
            <option value="all">Todas as regiões</option>
          </select>
        </div>
      </div>
      <!-- Chips de situação da visita -->
      <div class="filter-row" style="margin-top:10px" id="statusChips" role="group" aria-label="Filtrar por situação">
        <button class="filter-chip active" data-status="all">Todos</button>
        <button class="filter-chip" data-status="pendente">⏳ Pendente</button>
        <button class="filter-chip" data-status="realizada">✅ Realizada</button>
        <button class="filter-chip" data-status="medico_ausente">👤 Ausente</button>
        <button class="filter-chip" data-status="nao_atendido">❌ Não atendido</button>
        <button class="filter-chip" data-status="reagendada">📅 Reagendada</button>
        <button class="filter-chip clear-chip" id="clearAllFilters">✕ Limpar filtros</button>
      </div>
    </section>

    <!-- VISIT LIST -->
    <div class="section-header">
      <h2 id="listTitle">Visitas de hoje</h2>
      <span id="visitCount" class="section-count"></span>
    </div>

    <div id="visitList" aria-live="polite"></div>
  </main>

  <!-- REGISTRO MODAL -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3 id="modalTitle">Registrar visita</h3>
      <p class="modal-subtitle" id="modalSubtitle"></p>
      <div class="status-options">
        <button class="status-btn" data-value="realizada">
          <span class="status-icon">✅</span>Realizada
        </button>
        <button class="status-btn" data-value="medico_ausente">
          <span class="status-icon">👤</span>Médico ausente
        </button>
        <button class="status-btn" data-value="nao_atendido">
          <span class="status-icon">❌</span>Não foi possível atender
        </button>
        <button class="status-btn" data-value="reagendada">
          <span class="status-icon">📅</span>Reagendada
        </button>
        <button class="status-btn" data-value="pendente" style="grid-column: 1 / -1;">
          <span class="status-icon">⏳</span>Pendente (desfazer)
        </button>
      </div>
      <textarea id="obsInput" placeholder="Observação opcional (não incluir dados de pacientes)..." rows="3"></textarea>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancelar</button>
        <button class="btn-save" id="modalSave">Salvar</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button class="nav-item active" aria-current="page">
      <span class="nav-icon">🏠</span>Início
    </button>
    <a class="nav-item" href="index.html?view=list">
      <span class="nav-icon">📋</span>Agenda
    </a>
    <a class="nav-item" href="index.html?view=map">
      <span class="nav-icon">🗺️</span>Mapa
    </a>
    <a class="nav-item" href="clinicas.html">
      <span class="nav-icon">🏥</span>Clínicas
    </a>
  </nav>

  <script src="data/schedule-data.js"></script>
  <script>
    'use strict';

    // ──────────────── CONSTANTES ────────────────
    const WEEKDAY_KEYS = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
    const DAY_LABELS   = { segunda:'Segunda-feira', terca:'Terça-feira', quarta:'Quarta-feira', quinta:'Quinta-feira', sexta:'Sexta-feira', sabado:'Sábado', domingo:'Domingo' };

    const BADGE_STATUS = {
      realizada:     { label: '✅ Realizada',         cls: 'badge-done' },
      medico_ausente:{ label: '👤 Médico ausente',    cls: 'badge-absent' },
      nao_atendido:  { label: '❌ Não atendido',      cls: 'badge-notdone' },
      reagendada:    { label: '📅 Reagendada',        cls: 'badge-rescheduled' },
      pendente:      { label: '⏳ Pendente',           cls: 'badge-pending' }
    };

    const CARD_CLASS = {
      realizada: 'is-done',
      medico_ausente: 'is-absent',
      nao_atendido: 'is-not-done',
      reagendada: 'is-rescheduled'
    };

    // ──────────────── ESTADO ────────────────
    let currentDayKey = WEEKDAY_KEYS[new Date().getDay()];
    let currentPeriod = 'all';
    let currentStatus = 'all';
    let currentSpecialty = 'all';
    let currentRegion = 'all';
    let currentSearch = '';
    let modalVisitId = null;
    let selectedModalStatus = null;

    // ──────────────── DADOS ────────────────
    const source = window.scheduleSource || { records: [], issues: [] };

    function parseSchedule(label) {
      const text = (label || '').toLocaleLowerCase('pt-BR');
      const matches = [...text.matchAll(/(\d{1,2}):(\d{2})/g)];
      const toMin = m => Number(m[1]) * 60 + Number(m[2]);
      const start = matches[0] ? toMin(matches[0]) : null;
      const end   = matches[1] ? toMin(matches[1]) : start;
      const isMorningText    = text.includes('manhã') || text.includes('manha');
      const isAfternoonText  = text.includes('tarde');
      let sortMinutes = start;
      if (sortMinutes === null && isMorningText)   sortMinutes = text.includes('final') ? 719 : 480;
      if (sortMinutes === null && isAfternoonText)  sortMinutes = text.includes('final') ? 1079 : 720;
      return { start, end, sortMinutes: sortMinutes ?? 9999, approximate: start === null, isMorningText, isAfternoonText };
    }

    function normalizeText(v) {
      return (v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function buildVisitId(visit) {
      return `${normalizeText(visit.clinic)}|${normalizeText(visit.doctor)}|${visit.day}|${normalizeText(visit.time)}`;
    }

    // ──────────────── LOCAL STORAGE ────────────────
    function storageKey(dayKey) {
      return `visitas_registro_${dayKey}`;
    }

    function loadRecords(dayKey) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(dayKey)) || '{}');
      } catch { return {}; }
    }

    function saveRecord(dayKey, visitId, status, obs) {
      const records = loadRecords(dayKey);
      if (status === 'pendente') {
        delete records[visitId];
      } else {
        records[visitId] = { status, obs, timestamp: new Date().toISOString() };
      }
      localStorage.setItem(storageKey(dayKey), JSON.stringify(records));
    }

    // ──────────────── RELÓGIO ────────────────
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const date = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      document.getElementById('dateLabel').textContent = date;
    }

    // ──────────────── REDE ────────────────
    function updateNetwork() {
      const pill = document.getElementById('networkPill');
      const online = navigator.onLine;
      pill.textContent = online ? 'Online' : 'Offline';
      pill.classList.toggle('offline', !online);
    }

    // ──────────────── FILTROS ────────────────
    function initFilters() {
      const specialties = new Set();
      const regions = new Set();
      source.records.forEach(r => {
        if (r.specialty) specialties.add(r.specialty);
        if (r.region)    regions.add(r.region);
      });
      const specSel = document.getElementById('specialtySelect');
      [...specialties].sort((a,b) => a.localeCompare(b,'pt-BR')).forEach(s => {
        const o = document.createElement('option'); o.value = s; o.textContent = s;
        specSel.appendChild(o);
      });
      const regSel = document.getElementById('regionSelect');
      [...regions].sort((a,b) => a.localeCompare(b,'pt-BR')).forEach(r => {
        const o = document.createElement('option'); o.value = r; o.textContent = r;
        regSel.appendChild(o);
      });
    }

    // ──────────────── RENDERIZAÇÃO ────────────────
    function render() {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const isToday = WEEKDAY_KEYS[now.getDay()] === currentDayKey;
      const records = loadRecords(currentDayKey);
      const searchQuery = normalizeText(currentSearch);

      // Montar lista de visitas do dia
      const visits = [];
      source.records.forEach(rec => {
        const time = rec.days[currentDayKey];
        if (!time) return;
        const schedule = parseSchedule(time);

        visits.push({
          id: buildVisitId({ clinic: rec.clinic, doctor: rec.doctor, day: currentDayKey, time }),
          clinic: rec.clinic,
          doctor: rec.doctor,
          specialty: rec.specialty || '',
          region: rec.region || '',
          phone: rec.phone || '',
          scheduled: rec.scheduled || '',
          time,
          schedule,
          day: currentDayKey
        });
      });

      // Ordenação cronológica global
      visits.sort((a, b) =>
        a.schedule.sortMinutes - b.schedule.sortMinutes ||
        Number(a.schedule.approximate) - Number(b.schedule.approximate) ||
        a.clinic.localeCompare(b.clinic, 'pt-BR')
      );

      // Detectar próxima visita
      const futureExact = visits
        .map(v => v.schedule.start)
        .filter(t => t !== null && (!isToday || t >= nowMin));
      const nextTime = isToday && futureExact.length ? Math.min(...futureExact) : null;

      // Contagem de horários iguais
      const timeCounts = visits.reduce((m, v) => {
        if (v.schedule.start !== null) m.set(v.schedule.start, (m.get(v.schedule.start) || 0) + 1);
        return m;
      }, new Map());

      // Aplicar filtros
      const filtered = visits.filter(v => {
        const rec = records[v.id];
        const visitStatus = rec ? rec.status : 'pendente';

        if (currentStatus !== 'all' && visitStatus !== currentStatus) return false;

        if (currentPeriod !== 'all') {
          const inMorning   = v.schedule.isMorningText || (v.schedule.start !== null && v.schedule.start < 720);
          const inAfternoon = v.schedule.isAfternoonText || (v.schedule.end !== null && v.schedule.end >= 720);
          if (currentPeriod === 'manha' && !inMorning)   return false;
          if (currentPeriod === 'tarde' && !inAfternoon) return false;
        }

        if (currentSpecialty !== 'all' && v.specialty !== currentSpecialty) return false;
        if (currentRegion !== 'all' && v.region !== currentRegion) return false;

        if (searchQuery) {
          const haystack = normalizeText(`${v.clinic} ${v.doctor} ${v.specialty} ${v.region} ${v.scheduled} ${v.phone}`);
          if (!haystack.includes(searchQuery)) return false;
        }

        return true;
      });

      const listEl = document.getElementById('visitList');
      const countEl = document.getElementById('visitCount');
      const titleEl = document.getElementById('listTitle');

      titleEl.textContent = isToday ? 'Visitas de hoje' : `Visitas de ${DAY_LABELS[currentDayKey] || currentDayKey}`;
      countEl.textContent = filtered.length
        ? `${filtered.length} ${filtered.length === 1 ? 'visita' : 'visitas'}`
        : '';

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <strong>Nenhuma visita encontrada</strong>
            <p>Tente remover alguns filtros ou selecione outro dia.</p>
          </div>`;
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach(v => {
        const rec = records[v.id];
        const visitStatus = rec ? rec.status : null;
        const isNext = nextTime !== null && v.schedule.start === nextTime && !visitStatus;
        const sameTime = v.schedule.start !== null && timeCounts.get(v.schedule.start) > 1;

        // Classes do card
        const cardClasses = ['visit-card'];
        if (isNext) cardClasses.push('is-next');
        if (visitStatus && CARD_CLASS[visitStatus]) cardClasses.push(CARD_CLASS[visitStatus]);

        // Badges
        const badges = [];
        if (isNext) badges.push(`<span class="badge badge-next">PRÓXIMA VISITA</span>`);
        if (v.schedule.approximate) badges.push(`<span class="badge badge-warn">HORÁRIO A CONFIRMAR</span>`);
        if (sameTime && !v.schedule.approximate) badges.push(`<span class="badge badge-conflict">MESMO HORÁRIO</span>`);
        if (visitStatus && BADGE_STATUS[visitStatus]) {
          badges.push(`<span class="badge ${BADGE_STATUS[visitStatus].cls}">${BADGE_STATUS[visitStatus].label}</span>`);
        }

        const specialtyHtml = v.specialty
          ? `<div class="visit-specialty">${v.specialty}</div>`
          : '';

        const obsHtml = rec && rec.obs
          ? `<div style="font-size:.75rem;color:var(--color-muted);margin-top:6px;font-style:italic">📝 ${rec.obs}</div>`
          : '';

        const card = document.createElement('article');
        card.className = cardClasses.join(' ');
        card.dataset.visitId = v.id;
        card.innerHTML = `
          <div class="visit-time-col">
            <div class="visit-time">${v.time}</div>
            <div class="visit-region-pill">📍 ${v.region}</div>
          </div>
          <div class="visit-body">
            <div class="visit-clinic">🏥 ${v.clinic}</div>
            <div class="visit-doctor">${v.doctor}</div>
            ${specialtyHtml}
            ${obsHtml}
            ${badges.length ? `<div class="visit-badges">${badges.join('')}</div>` : ''}
            <div class="visit-actions">
              <button class="btn-register" data-visit-id="${v.id}" data-clinic="${escapeAttr(v.clinic)}" data-doctor="${escapeAttr(v.doctor)}">
                ${visitStatus ? '✏️ Editar registro' : '📝 Registrar visita'}
              </button>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });

      // Adicionar event listeners nos botões de registro
      listEl.querySelectorAll('.btn-register').forEach(btn => {
        btn.addEventListener('click', e => {
          openModal(
            e.currentTarget.dataset.visitId,
            e.currentTarget.dataset.clinic,
            e.currentTarget.dataset.doctor
          );
        });
      });
    }

    function escapeAttr(str) {
      return (str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ──────────────── MODAL ────────────────
    function openModal(visitId, clinic, doctor) {
      modalVisitId = visitId;
      selectedModalStatus = null;
      document.getElementById('modalTitle').textContent = 'Registrar visita';
      document.getElementById('modalSubtitle').textContent = `${clinic} • ${doctor}`;
      document.getElementById('obsInput').value = '';

      // Pré-selecionar status existente
      const records = loadRecords(currentDayKey);
      if (records[visitId]) {
        selectedModalStatus = records[visitId].status;
        document.getElementById('obsInput').value = records[visitId].obs || '';
      }

      // Resetar botões
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.value === selectedModalStatus);
      });

      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      modalVisitId = null;
      selectedModalStatus = null;
    }

    // ──────────────── EVENT LISTENERS ────────────────
    document.addEventListener('DOMContentLoaded', () => {

      // Relógio
      updateClock();
      setInterval(updateClock, 30000);

      // Rede
      updateNetwork();
      window.addEventListener('online', updateNetwork);
      window.addEventListener('offline', updateNetwork);

      // Filtros
      initFilters();

      // Chips de período
      document.getElementById('periodChips').querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.getElementById('periodChips').querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentPeriod = chip.dataset.period;
          render();
        });
      });

      // Chips de status
      document.getElementById('statusChips').querySelectorAll('[data-status]').forEach(chip => {
        chip.addEventListener('click', () => {
          document.getElementById('statusChips').querySelectorAll('[data-status]').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentStatus = chip.dataset.status;
          render();
        });
      });

      // Selects
      document.getElementById('specialtySelect').addEventListener('change', e => {
        currentSpecialty = e.target.value;
        render();
      });
      document.getElementById('regionSelect').addEventListener('change', e => {
        currentRegion = e.target.value;
        render();
      });

      // Busca
      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');
      searchInput.addEventListener('input', () => {
        currentSearch = searchInput.value;
        searchClear.classList.toggle('visible', currentSearch.length > 0);
        render();
      });
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        currentSearch = '';
        searchClear.classList.remove('visible');
        render();
      });

      // Limpar todos os filtros
      document.getElementById('clearAllFilters').addEventListener('click', () => {
        currentPeriod = 'all';
        currentStatus = 'all';
        currentSpecialty = 'all';
        currentRegion = 'all';
        currentSearch = '';
        searchInput.value = '';
        searchClear.classList.remove('visible');
        document.getElementById('specialtySelect').value = 'all';
        document.getElementById('regionSelect').value = 'all';
        document.getElementById('periodChips').querySelectorAll('.filter-chip').forEach((c,i) => c.classList.toggle('active', i===0));
        document.getElementById('statusChips').querySelectorAll('[data-status]').forEach((c,i) => c.classList.toggle('active', i===0));
        render();
      });

      // Modal — botões de status
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedModalStatus = btn.dataset.value;
          document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });

      // Modal — cancelar
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalBackdrop').addEventListener('click', e => {
        if (e.target === document.getElementById('modalBackdrop')) closeModal();
      });

      // Modal — salvar
      document.getElementById('modalSave').addEventListener('click', () => {
        if (!selectedModalStatus) { alert('Selecione uma situação para a visita.'); return; }
        const obs = document.getElementById('obsInput').value.trim();
        saveRecord(currentDayKey, modalVisitId, selectedModalStatus, obs);
        closeModal();
        render();
      });

      // Auto-atualizar se for hoje
      setInterval(() => {
        const todayKey = WEEKDAY_KEYS[new Date().getDay()];
        if (currentDayKey === todayKey) render();
      }, 60000);

      // Renderização inicial
      render();
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
