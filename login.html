<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17324d"><meta name="robots" content="noindex">
  <title>Entrar — Roteiro Cuiabá</title><link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-shell">
    <header class="brand"><h1>Roteiro de Visitas</h1><p>Acesso pessoal e protegido</p></header>
    <section class="card" aria-labelledby="title">
      <h2 id="title">Entrar</h2><p class="intro">Use o e-mail cadastrado no seu projeto Supabase.</p>
      <form id="loginForm">
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></div>
        <button id="submit" type="submit">Entrar</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <a class="link-button" href="recuperar-senha.html">Esqueci minha senha</a>
      <p class="security">A sessão fica armazenada neste navegador. Use “Sair” antes de entregar um dispositivo a outra pessoa.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/supabase.js"></script><script src="js/supabase-client.js"></script>
  <script>
    "use strict";
    const form=document.getElementById("loginForm"),statusBox=document.getElementById("status"),submit=document.getElementById("submit");
    const show=(message,type="")=>{statusBox.textContent=message;statusBox.className=`status ${type}`};
    const nextPage=()=>{const value=new URLSearchParams(location.search).get("next")||"dashboard.html";return /^[a-z0-9._?=&%-]+$/i.test(value)?value:"dashboard.html"};
    form.addEventListener("submit",async event=>{event.preventDefault();submit.disabled=true;show("Verificando acesso…");try{const client=RoteiroAuth.getClient();const email=form.email.value.trim();const {error}=await client.auth.signInWithPassword({email,password:form.password.value});if(error)throw error;location.replace(nextPage())}catch(error){show(error.message||"Não foi possível entrar.","error")}finally{submit.disabled=false}});
    (async()=>{try{const {data}=await RoteiroAuth.getClient().auth.getSession();if(data.session)location.replace(nextPage())}catch(error){show(error.message,"error")}})();
  </script>
</body>
</html>
