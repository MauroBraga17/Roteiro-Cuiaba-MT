<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quem posso visitar agora? — Roteiro Cuiabá</title>
  <meta name="description" content="Médicos com atendimento compatível com o horário atual.">
  <meta name="theme-color" content="#17324d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config/supabase.js"></script><script defer src="js/supabase-client.js"></script><script defer src="js/auth-guard.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-header-start: #17324d;
      --color-header-end: #1f4a6e;
      --color-primary: #176b8f;
      --color-green: #1a7a45;
      --color-orange: #d35400;
      --color-bg: #f2f5f8;
      --color-card: #ffffff;
      --color-border: #dce5ed;
      --color-text: #243447;
      --color-muted: #637381;
      --nav-h: 64px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
    }

    /* HEADER */
    header {
      background: linear-gradient(150deg, var(--color-header-start), var(--color-header-end));
      color: #fff;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 1.2rem;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }

    .header-info { flex: 1; }
    .header-info h1 { font-size: 1.05rem; font-weight: 800; line-height: 1.2; }
    .header-info p  { font-size: 0.75rem; color: #b8d4e8; margin-top: 2px; }

    .time-badge {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      flex-shrink: 0;
    }
    .time-badge .tb-time { font-size: 1.1rem; font-weight: 800; line-height: 1; }
    .time-badge .tb-day  { font-size: 0.65rem; color: #b8d4e8; margin-top: 2px; }

    /* MAP */
    #map {
      width: 100%;
      height: 38vh;
      min-height: 220px;
      max-height: 400px;
      z-index: 1;
    }

    /* STATUS BAR (acima da lista) */
    .status-bar {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status-bar .count-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-text);
    }

    .status-bar .count-sub {
      font-size: 0.72rem;
      color: var(--color-muted);
      margin-top: 2px;
    }

    /* LOCATION BAR */
    .location-bar {
      background: #edf5fa;
      border-bottom: 1px solid #c7dce8;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }

    .location-bar .loc-icon { font-size: 1rem; flex-shrink: 0; }
    .location-bar .loc-text { flex: 1; color: var(--color-muted); }
    .location-bar .loc-text strong { color: var(--color-text); }

    .btn-locate {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--color-primary);
      background: none;
      color: var(--color-primary);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* REGION FILTER */
    .region-filter {
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .region-filter::-webkit-scrollbar { display: none; }

    .region-chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--color-border);
      background: #f2f5f8;
      color: var(--color-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .region-chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

    /* VISIT LIST */
    #nowList {
      padding: 12px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* CARD */
    .now-card {
      background: var(--color-card);
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .now-card:active { transform: scale(0.99); }

    .now-card.highlighted {
      border-color: var(--color-green);
      box-shadow: 0 4px 16px rgba(26,122,69,0.15);
    }

    .card-header {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--color-border);
    }

    .card-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      min-height: 52px;
      background: var(--color-primary);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .card-title-area {
      flex: 1;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-clinic { font-weight: 800; font-size: 0.9rem; line-height: 1.2; color: var(--color-text); }
    .card-region { font-size: 0.72rem; color: var(--color-muted); margin-top: 2px; }

    .compat-badge {
      flex-shrink: 0;
      padding: 4px 8px;
      border-radius: 6px;
      background: #e6f4ec;
      color: var(--color-green);
      font-size: 0.65rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
    }

    .card-body {
      padding: 10px 12px;
    }

    .card-doctor { font-size: 0.9rem; font-weight: 700; color: var(--color-text); margin-bottom: 3px; }
    .card-specialty { font-size: 0.76rem; color: var(--color-primary); font-weight: 700; margin-bottom: 8px; }

    .card-meta {
      display: grid;
      gap: 4px;
      margin-bottom: 10px;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--color-muted);
    }
    .meta-row strong { color: var(--color-text); }
    .meta-row .meta-icon { flex-shrink: 0; width: 16px; text-align: center; }

    .warn-text {
      display: inline-block;
      background: #fff3e0;
      color: #b05000;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* ACTION BUTTONS */
    .card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      border: 1.5px solid var(--color-border);
      background: #f8fafc;
      color: var(--color-text);
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:hover { background: #edf5fa; }
    .action-btn.maps { border-color: #4285f4; color: #4285f4; }
    .action-btn.waze { border-color: #00aeef; color: #00aeef; }
    .action-btn.map-marker { border-color: var(--color-primary); color: var(--color-primary); }

    /* EMPTY STATE */
    .empty-now {
      text-align: center;
      padding: 50px 24px;
      color: var(--color-muted);
    }
    .empty-now .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-now strong { display: block; font-size: 1.1rem; margin-bottom: 8px; color: var(--color-text); }
    .empty-now p { font-size: 0.85rem; line-height: 1.5; margin-bottom: 16px; }
    .empty-now a {
      display: inline-block;
      padding: 10px 20px;
      background: var(--color-primary);
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: #fff;
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -4px 18px rgba(17,24,39,0.1);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 200;
    }
    .nav-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; border: none; background: transparent;
      color: var(--color-muted); font-family: inherit;
      font-size: 0.72rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item .nav-icon { font-size: 1.35rem; line-height: 1; }
    .nav-item.active { color: var(--color-primary); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="dashboard.html" aria-label="Voltar">‹</a>
    <div class="header-info">
      <h1>Quem posso visitar agora?</h1>
      <p>Atendimentos compatíveis com o horário atual</p>
    </div>
    <div class="time-badge">
      <div id="headerClock" class="tb-time">--:--</div>
      <div id="headerDay" class="tb-day">--</div>
    </div>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- LOCALIZAÇÃO -->
  <div class="location-bar">
    <span class="loc-icon">📍</span>
    <div class="loc-text">
      <strong id="locText">Localização não ativa</strong><br>
      <span id="locSub">A distância estimada não está disponível.</span>
    </div>
    <button class="btn-locate" id="locateBtn">Usar minha localização</button>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div>
      <div class="count-text" id="countText">Calculando...</div>
      <div class="count-sub" id="countSub"></div>
    </div>
  </div>

  <!-- FILTRO POR REGIÃO -->
  <div class="region-filter" id="regionFilter" role="group" aria-label="Filtrar por região">
    <button class="region-chip active" data-region="all">Todas as regiões</button>
  </div>

  <!-- LISTA -->
  <div id="nowList" aria-live="polite"></div>

  <!-- NAV -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <a class="nav-item" href="dashboard.html">
      <span class="nav-icon">🏠</span>Início
    </a>
    <a class="nav-item" href="index.html?view=list">
      <span class="nav-icon">📋</span>Agenda
    </a>
    <a class="nav-item" href="index.html?view=map">
      <span class="nav-icon">🗺️</span>Mapa
    </a>
    <a class="nav-item" href="clinicas.html">
      <span class="nav-icon">🏥</span>Clínicas
    </a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/schedule-data.js"></script>
  <script>
    'use strict';

    const WEEKDAY_KEYS = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
    const DAY_SHORT = { domingo:'DOM', segunda:'SEG', terca:'TER', quarta:'QUA', quinta:'QUI', sexta:'SEX', sabado:'SÁB' };

    // Coordenadas regionais (aproximadas)
    const REGION_COORDS = {
      'Araés':           [-15.5890, -56.0880],
      'Centro e Quilombo': [-15.5989, -56.0949],
      'Jardim Cuiabá':   [-15.6030, -56.1130],
      'Santa Rosa':      [-15.5850, -56.1180],
      'Várzea Grande':   [-15.6486, -56.1326]
    };

    const source = window.scheduleSource || { records: [] };
    let userLocation = null;
    let selectedRegion = 'all';
    let leafletMarkers = [];
    let leafletMap = null;

    // ─── RELÓGIO ───
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('headerClock').textContent = `${h}:${m}`;
      const dayKey = WEEKDAY_KEYS[now.getDay()];
      document.getElementById('headerDay').textContent = DAY_SHORT[dayKey] || '';
    }

    // ─── MAPA ───
    function initMap() {
      leafletMap = L.map('map').setView([-15.6010, -56.0979], 12);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri',
        maxZoom: 18
      }).addTo(leafletMap);
    }

    // ─── PARSE HORÁRIO ───
    function parseSchedule(label) {
      const text = (label || '').toLocaleLowerCase('pt-BR');
      const matches = [...text.matchAll(/(\d{1,2}):(\d{2})/g)];
      const toMin = m => Number(m[1]) * 60 + Number(m[2]);
      const start = matches[0] ? toMin(matches[0]) : null;
      const end   = matches[1] ? toMin(matches[1]) : start;
      const isMorningText   = text.includes('manhã') || text.includes('manha');
      const isAfternoonText = text.includes('tarde');
      let sortMinutes = start;
      if (sortMinutes === null && isMorningText)  sortMinutes = text.includes('final') ? 719 : 480;
      if (sortMinutes === null && isAfternoonText) sortMinutes = text.includes('final') ? 1079 : 720;
      return { start, end, sortMinutes: sortMinutes ?? 9999, approximate: start === null, isMorningText, isAfternoonText };
    }

    // ─── COMPATIBILIDADE COM HORÁRIO ATUAL ───
    function isCompatible(schedule, nowMin) {
      if (schedule.approximate) return null; // horário a confirmar — não inclui como compatível exato

      const GRACE = 30; // tolerância em minutos após o fim do atendimento

      if (schedule.start !== null && schedule.end !== null) {
        // Intervalo definido: start <= agora <= end + tolerância
        return nowMin >= schedule.start && nowMin <= schedule.end + GRACE;
      }

      if (schedule.start !== null) {
        // Horário único: até 90 min após o início
        return nowMin >= schedule.start && nowMin <= schedule.start + 90;
      }

      if (schedule.isMorningText) return nowMin < 720;   // "Manhã" → antes das 12h
      if (schedule.isAfternoonText) return nowMin >= 720; // "Tarde" → após as 12h

      return null;
    }

    // ─── DISTÂNCIA ───
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ─── RENDER ───
    function render() {
      const now = new Date();
      const dayKey = WEEKDAY_KEYS[now.getDay()];
      const nowMin = now.getHours() * 60 + now.getMinutes();

      const compatible = [];
      const approximate = [];

      source.records.forEach(rec => {
        const time = rec.days[dayKey];
        if (!time) return;
        const schedule = parseSchedule(time);
        const compat = isCompatible(schedule, nowMin);

        const entry = {
          clinic: rec.clinic,
          doctor: rec.doctor,
          specialty: rec.specialty || '',
          region: rec.region || '',
          phone: rec.phone || '',
          time,
          schedule,
          day: dayKey,
          distance: null
        };

        if (userLocation && REGION_COORDS[rec.region]) {
          const [rlat, rlon] = REGION_COORDS[rec.region];
          entry.distance = calcDistance(userLocation.lat, userLocation.lon, rlat, rlon);
        }

        if (compat === true) compatible.push(entry);
        else if (compat === null && schedule.approximate) approximate.push(entry);
      });

      // Ordenar por distância (se disponível) ou por horário
      const sortFn = (a, b) => {
        if (a.distance !== null && b.distance !== null) return a.distance - b.distance;
        return a.schedule.sortMinutes - b.schedule.sortMinutes;
      };
      compatible.sort(sortFn);

      // Filtrar por região
      const filtered = selectedRegion === 'all'
        ? compatible
        : compatible.filter(v => v.region === selectedRegion);

      // Construir chips de região
      const allRegions = [...new Set(compatible.map(v => v.region))].sort((a,b) => a.localeCompare(b,'pt-BR'));
      const regionFilter = document.getElementById('regionFilter');
      regionFilter.innerHTML = '<button class="region-chip active" data-region="all">Todas as regiões</button>';
      allRegions.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'region-chip' + (r === selectedRegion ? ' active' : '');
        btn.dataset.region = r;
        btn.textContent = r;
        regionFilter.appendChild(btn);
      });
      regionFilter.querySelectorAll('.region-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          selectedRegion = chip.dataset.region;
          render();
        });
      });

      // Atualizar mapa
      leafletMarkers.forEach(m => leafletMap.removeLayer(m));
      leafletMarkers = [];

      const regionGroups = {};
      filtered.forEach(v => {
        if (!regionGroups[v.region]) regionGroups[v.region] = [];
        regionGroups[v.region].push(v);
      });

      let markerIndex = 1;
      Object.entries(regionGroups).forEach(([region, visits]) => {
        const coords = REGION_COORDS[region];
        if (!coords) return;

        const [lat, lon] = coords;

        // Marcador numerado com ícone customizado
        const icon = L.divIcon({
          className: '',
          html: `<div style="width:34px;height:34px;border-radius:50%;background:#176b8f;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.35);border:2px solid #fff">${markerIndex}</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });
        markerIndex++;

        const popupItems = visits.map(v => `
          <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eee">
            <div style="font-weight:800;font-size:.9rem;color:#243447">${v.doctor}</div>
            <div style="font-size:.78rem;color:#176b8f;font-weight:700;margin:2px 0">${v.specialty || '—'}</div>
            <div style="font-size:.78rem;color:#637381"><strong>Atendimento compatível:</strong> ${v.time}</div>
          </div>
        `).join('');

        const gmUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
        const wazeUrl = `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;

        const popupHtml = `
          <div style="min-width:200px">
            <div style="font-weight:800;font-size:1rem;color:#17324d;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #3498db">${region}</div>
            ${popupItems}
            <div style="display:flex;gap:6px;margin-top:6px">
              <a href="${gmUrl}" target="_blank" rel="noopener" style="flex:1;padding:7px;border-radius:7px;background:#4285f4;color:#fff;text-align:center;font-size:.72rem;font-weight:700;text-decoration:none">🗺️ Maps</a>
              <a href="${wazeUrl}" target="_blank" rel="noopener" style="flex:1;padding:7px;border-radius:7px;background:#00aeef;color:#fff;text-align:center;font-size:.72rem;font-weight:700;text-decoration:none">🧭 Waze</a>
            </div>
            <div style="font-size:.65rem;color:#8a98a5;margin-top:6px;text-align:center">⚠️ Coordenadas aproximadas da região</div>
          </div>
        `;

        const marker = L.marker([lat, lon], { icon }).addTo(leafletMap);
        marker.bindPopup(popupHtml, { maxHeight: 320 });
        leafletMarkers.push(marker);
      });

      if (leafletMarkers.length > 0) {
        const group = new L.featureGroup(leafletMarkers);
        leafletMap.fitBounds(group.getBounds().pad(0.25));
      }

      // Status bar
      const countEl = document.getElementById('countText');
      const subEl = document.getElementById('countSub');
      const dayLabel = { segunda:'Segunda-feira', terca:'Terça-feira', quarta:'Quarta-feira', quinta:'Quinta-feira', sexta:'Sexta-feira', sabado:'Sábado', domingo:'Domingo' }[dayKey];

      if (filtered.length > 0) {
        countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'atendimento compatível' : 'atendimentos compatíveis'}`;
        subEl.textContent = `${dayLabel} • ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
      } else if (compatible.length > 0) {
        countEl.textContent = `0 visitas na região selecionada`;
        subEl.textContent = `${compatible.length} em outras regiões — remova o filtro`;
      } else {
        countEl.textContent = 'Nenhum atendimento compatível agora';
        subEl.textContent = `${dayLabel} • ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
      }

      // Renderizar lista
      const listEl = document.getElementById('nowList');
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        const hasApprox = approximate.filter(v => selectedRegion === 'all' || v.region === selectedRegion).length > 0;
        listEl.innerHTML = `
          <div class="empty-now">
            <div class="empty-icon">${compatible.length === 0 ? '😴' : '🔍'}</div>
            <strong>${compatible.length === 0 ? 'Nenhum atendimento compatível agora' : 'Nenhum na região selecionada'}</strong>
            <p>${compatible.length === 0
              ? 'Não há médicos com horário de atendimento compatível com este momento.'
              : 'Selecione outra região ou escolha "Todas as regiões" para ver todos.'
            }</p>
            ${hasApprox ? '<p style="font-size:.8rem;color:#b05000;background:#fff3e0;border-radius:8px;padding:8px 12px">⚠️ Há médicos com <strong>horário a confirmar</strong> que podem estar disponíveis — verifique a agenda completa.</p>' : ''}
            <a href="index.html?view=list">Ver agenda completa</a>
          </div>`;
        return;
      }

      filtered.forEach((v, idx) => {
        const coords = REGION_COORDS[v.region];
        const gmUrl  = coords ? `https://www.google.com/maps/dir/?api=1&destination=${coords[0]},${coords[1]}` : `https://www.google.com/maps/search/${encodeURIComponent(v.clinic + ' ' + v.region + ' Cuiabá MT')}`;
        const wazeUrl = coords ? `https://waze.com/ul?ll=${coords[0]},${coords[1]}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent(v.clinic + ' ' + v.region)}`;

        const distHtml = v.distance !== null
          ? `<div class="meta-row"><span class="meta-icon">📏</span> <span>Distância estimada: <strong>${v.distance.toFixed(1)} km</strong> (região)</span></div>`
          : '';

        const phoneDigits = (v.phone || '').replace(/\D/g,'');
        const phoneHtml = phoneDigits.length >= 8
          ? `<div class="meta-row"><span class="meta-icon">📞</span> <a href="tel:${phoneDigits}" style="color:var(--color-primary);font-weight:700;text-decoration:none">${v.phone}</a></div>`
          : '';

        const card = document.createElement('article');
        card.className = 'now-card' + (idx === 0 ? ' highlighted' : '');
        card.innerHTML = `
          <div class="card-header">
            <div class="card-number">${idx + 1}</div>
            <div class="card-title-area">
              <div>
                <div class="card-clinic">🏥 ${v.clinic}</div>
                <div class="card-region">📍 ${v.region}</div>
              </div>
              <div class="compat-badge">Atendimento<br>compatível</div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-doctor">${v.doctor}</div>
            ${v.specialty ? `<div class="card-specialty">${v.specialty}</div>` : ''}
            <div class="card-meta">
              <div class="meta-row"><span class="meta-icon">🕐</span> <span><strong>Atendimento:</strong> ${v.time}</span></div>
              ${distHtml}
              ${phoneHtml}
            </div>
            <div class="card-actions">
              <button class="action-btn map-marker" data-region="${v.region}" onclick="focusRegion('${v.region}')">📍 Ver no mapa</button>
              <a class="action-btn maps" href="${gmUrl}" target="_blank" rel="noopener">🗺️ Google Maps</a>
              <a class="action-btn waze" href="${wazeUrl}" target="_blank" rel="noopener">🧭 Waze</a>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });

      // Mostrar horários a confirmar ao final (se houver)
      const approxFiltered = approximate.filter(v => selectedRegion === 'all' || v.region === selectedRegion);
      if (approxFiltered.length > 0) {
        const sep = document.createElement('div');
        sep.style.cssText = 'padding:8px 0 4px;font-size:.78rem;color:#b05000;font-weight:700;';
        sep.textContent = `⚠️ Horário a confirmar (${approxFiltered.length} médico${approxFiltered.length > 1 ? 's' : ''})`;
        listEl.appendChild(sep);
        approxFiltered.forEach(v => {
          const card = document.createElement('article');
          card.className = 'now-card';
          card.style.opacity = '0.7';
          card.innerHTML = `
            <div class="card-body" style="padding:12px">
              <div class="warn-text">⚠️ HORÁRIO A CONFIRMAR</div>
              <div class="card-clinic" style="font-size:.85rem">🏥 ${v.clinic}</div>
              <div class="card-doctor" style="margin-top:4px">${v.doctor}</div>
              <div class="meta-row" style="margin-top:6px"><span class="meta-icon">🕐</span><span>${v.time}</span></div>
              <div class="meta-row"><span class="meta-icon">📍</span><span>${v.region}</span></div>
            </div>
          `;
          listEl.appendChild(card);
        });
      }
    }

    // ─── VER NO MAPA ───
    function focusRegion(region) {
      const coords = REGION_COORDS[region];
      if (!coords || !leafletMap) return;
      leafletMap.setView(coords, 15, { animate: true });
      leafletMarkers.forEach(m => {
        if (m.getLatLng().lat === coords[0] && m.getLatLng().lng === coords[1]) {
          m.openPopup();
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─── LOCALIZAÇÃO ───
    function activateLocation() {
      if (!navigator.geolocation) {
        document.getElementById('locText').textContent = 'Geolocalização não disponível neste navegador.';
        return;
      }
      document.getElementById('locText').textContent = 'Obtendo localização...';
      document.getElementById('locateBtn').disabled = true;

      navigator.geolocation.getCurrentPosition(
        pos => {
          userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          document.getElementById('locText').textContent = 'Localização ativa';
          document.getElementById('locSub').textContent = `Distâncias calculadas a partir da sua posição atual.`;
          document.getElementById('locateBtn').textContent = 'Atualizar';
          document.getElementById('locateBtn').disabled = false;

          // Adicionar marcador do usuário
          L.circleMarker([userLocation.lat, userLocation.lon], {
            radius: 10, fillColor: '#1a7a45', fillOpacity: 0.9,
            color: '#fff', weight: 2, opacity: 1
          }).addTo(leafletMap).bindPopup('📍 Você está aqui');

          render();
        },
        err => {
          document.getElementById('locText').textContent = 'Localização não autorizada';
          document.getElementById('locSub').textContent = 'As distâncias não estão disponíveis. Use os filtros de região abaixo.';
          document.getElementById('locateBtn').disabled = false;
        },
        { timeout: 10000 }
      );
    }

    // ─── INIT ───
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      updateClock();
      setInterval(updateClock, 30000);
      setInterval(render, 60000);

      document.getElementById('locateBtn').addEventListener('click', activateLocation);
      render();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
